<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Mother's Day, Mom!</title>
    <style>
        body {
            <audio id="momSong">
                <source src="song.mp3" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
            background-color: #fff5f7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            z-index: 10;
            <button id="playBtn" onclick="toggleMusic()">Play Music 🎵</button>
        }
        h1 { color: #d63384; margin-bottom: 0.5rem; }
        p { color: #555; line-height: 1.6; }
        .heart { color: #e74c3c; font-size: 50px; animation: pulse 1.5s infinite; }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        /* Simple floating animation for the background */
        .bg-heart {
            position: absolute;
            color: rgba(214, 51, 132, 0.1);
            font-size: 20px;
            user-select: none;
            animation: float 5s linear infinite;
        }
        @keyframes float {
            from { transform: translateY(100vh); }
            to { transform: translateY(-10vh); }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="heart">❤️</div>
        <h1>Happy Mother's Day!</h1>
        <p>Hi Mom! I built this little corner of the internet just for you. Thanks for being the best. Love you!</p>
    </div>

    <script>
        // Create random floating hearts
        for (let i = 0; i < 20; i++) {
            let heart = document.createElement('div');
            heart.className = 'bg-heart';
            heart.innerHTML = '🌸';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 2) + 's';
            heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
            document.body.appendChild(heart);
        }
    </script>
</body>
</html>
