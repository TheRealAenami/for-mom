<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Mother's Day, Mom!</title>
    <style>
        /* 1. Background Setup */
        body {
            background-color: #fff5f7;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden; /* Keeps hearts from creating scrollbars */
        }

        /* 2. The Card */
        .card {
            background: white;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(214, 51, 132, 0.2);
            text-align: center;
            max-width: 350px;
            width: 85%;
            position: relative;
            z-index: 100; /* Ensures card stays above floating hearts */
        }

        h1 { color: #d63384; margin-top: 0; font-size: 1.8rem; }
        p { color: #555; line-height: 1.6; font-size: 1.1rem; }

        .heart-main { 
            color: #e74c3c; 
            font-size: 60px; 
            margin-bottom: 10px;
            display: block;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* 3. The Play Button */
        #playBtn {
            background-color: #ff4d6d;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.4);
            transition: all 0.3s ease;
        }

        #playBtn:hover {
            background-color: #ff758f;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 77, 109, 0.6);
        }

        /* 4. Floating Hearts Styles */
        .floating-heart {
            position: absolute;
            bottom: -50px;
            user-select: none;
            z-index: 1;
            pointer-events: none; /* Hearts won't block clicking the button */
            animation: floatUp linear forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Hidden Audio Element (Requires song.mp3 in the same folder) -->
    <audio id="momSong" loop>
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <div class="card">
        <span class="heart-main">❤️</span>
        <h1>Happy Mother's Day!</h1>
        <p id="message">I built this website to tell you how much I love you. Click below for a surprise!</p>
        
        <button id="playBtn" onclick="startSurprise()">Play Music 🎵</button>
    </div>

    <script>
        // Start Music and Change Text
        function startSurprise() {
            const music = document.getElementById('momSong');
            const btn = document.getElementById('playBtn');
            const msg = document.getElementById('message');

            if (music.paused) {
                music.play().catch(() => console.log("Check if song.mp3 exists!"));
                btn.innerHTML = "Pause Music ⏸️";
                msg.innerHTML = "You're the best mom in the world! <br><br> (And look at all these flowers!)";
            } else {
                music.pause();
                btn.innerHTML = "Play Music 🎵";
            }
        }

        // Background Floating Elements Generator
        function createFloatingElement() {
            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            
            // Randomly pick an emoji
            const icons = ['🌸', '💖', '✨', '💕', '🌷', '❤️', '🌹'];
            heart.innerHTML = icons[Math.floor(Math.random() * icons.length)];
            
            // Random position and size
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = (Math.random() * 20 + 20) + 'px';
            
            // Random speed (between 4 and 8 seconds)
            const duration = (Math.random() * 4 + 4);
            heart.style.animationDuration = duration + 's';
            
            document.body.appendChild(heart);

            // Clean up the heart after animation finishes
            setTimeout(() => {
                heart.remove();
            }, duration * 1000);
        }

        // Create a new heart every 300ms
        setInterval(createFloatingElement, 300);
    </script>
</body>
</html>
